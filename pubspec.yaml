name: materium
description: Get Android app updates straight from the source.
version: 1.5.2+2338
homepage: https://github.com/deminearchiver/materium
repository: https://github.com/deminearchiver/materium
issue_tracker: https://github.com/deminearchiver/materium/issues
publish_to: none

workspace: []

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  # SDK dependencies
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Git dependencies (1P)
  animation:
    git:
      url: https://github.com/deminearchiver/dart-flutter-packages.git
      ref: 2cabf358cb9d954e70ff2f70ffa2962d255d11a4
      path: packages/framework/animation
  layout:
    git:
      url: https://github.com/deminearchiver/dart-flutter-packages.git
      ref: 2cabf358cb9d954e70ff2f70ffa2962d255d11a4
      path: packages/framework/layout
  material:
    git:
      url: https://github.com/deminearchiver/dart-flutter-packages.git
      ref: 2cabf358cb9d954e70ff2f70ffa2962d255d11a4
      path: packages/framework/material

  # Git dependencies (3P)
  android_package_installer: # TODO: See if PR will be accepted (dev may not be active), else remove this comment
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: c9e144fae63231b5d1d7b88af779c314afcb6e83
  android_package_manager: # TODO: Make PR and switch to upstream
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: 18231a8a2343747440b0bfe90f7d56ef7f586099
  shared_storage: # TODO: Is this maintained?
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: 012e22791138958e089f6c1a8d6c4c6943a9f253
  shizuku_apk_installer:
    git:
      url: https://github.com/re7gog/shizuku_apk_installer
      ref: 3ef7f8fbf904848d144304556b0f80c91fee82a5

  # Hosted dependencies
  android_intent_plus: ^6.1.0
  app_links: ^7.2.1
  archive: ^4.0.9
  background_fetch: ^1.7.0
  battery_plus: ^7.1.1
  bcrypt: ^1.2.0
  collection: ^1.19.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  device_info_ffi: ^2.0.1
  drift_flutter: ^0.3.1
  drift_sqflite: ^2.0.1
  drift: ^2.34.3
  dynamic_color_ffi: ^1.1.2
  easy_localization: ^3.0.8
  file_picker: ^12.0.0-beta.7
  flex_color_picker: ^3.8.0
  flutter_archive: ^6.3.1
  flutter_charset_detector: ^6.0.0
  flutter_fgbg: ^0.8.0
  flutter_foreground_task: ^10.0.0
  flutter_local_notifications: ^22.2.0
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
  flutter_typeahead: ^6.0.0
  fluttertoast: ^9.1.0
  freezed_annotation: ^3.1.0
  hsluv: ^1.1.3
  html: ^0.15.6
  http: ^1.6.0
  json_annotation: ^4.12.0
  linked_layouts: ^0.6.0
  markdown: ^7.3.1
  meta: ^1.18.0
  motor: ^1.1.0
  path_provider: ^2.1.6
  permission_handler: ^12.0.3
  provider: ^6.1.5+1
  pub_semver: ^2.2.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  skeletonizer: ^2.1.3
  slang_flutter: ^4.18.0
  slang: ^4.18.0
  sqflite: ^2.4.3
  syntax_highlight: ^0.5.0
  talker_flutter: ^5.1.20
  touch_targets: ^0.5.0
  url_launcher: ^6.3.2
  vector_graphics: ^1.2.2
  webview_flutter: ^4.14.1

dev_dependencies:
  # Hosted dependencies
  build_runner: ^2.15.1
  deminearchiver_lints: ^2.1.2
  drift_dev: ^2.34.5
  fastforge: ^0.6.11
  flutter_gen_runner: ^5.15.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.0
  slang_build_runner: ^4.18.0

dependency_overrides:
  # Hosted dependencies
  archive: ^4.0.9 # fastforge uses outdated version
  device_info_plus: ^13.2.0 # Needed for unknown reasons
  material_color_utilities: ^0.13.0 # Flutter pinned dependency
  uuid: ^4.6.0 # fastforge uses outdated version

flutter:
  uses-material-design: true
  generate: false
  assets:
    # Certificates
    - assets/ca/

    # Graphics
    - assets/graphics/

    # App icons
    - assets/ic_launcher/

    # Translation files for easy_localization
    - assets/translations/

    # Open Font Licenses
    - assets/fonts/googlesans/OFL.txt
    - assets/fonts/googlesanscode/OFL.txt
    - assets/fonts/googlesansflex/OFL.txt
    - assets/fonts/robotoflex/OFL.txt
    - assets/fonts/monaspace/OFL.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/googlesans/GoogleSans-VariableFont_GRAD,opsz,wght.ttf
          style: normal
        - asset: assets/fonts/googlesans/GoogleSans-Italic-VariableFont_GRAD,opsz,wght.ttf
          style: italic
    - family: Google Sans Code
      fonts:
        - asset: assets/fonts/googlesanscode/GoogleSansCode[MONO,wght].ttf
          style: normal
        - asset: assets/fonts/googlesanscode/GoogleSansCode-Italic[MONO,wght].ttf
          style: italic
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/googlesansflex/GoogleSansFlex-VariableFont_GRAD,ROND,opsz,slnt,wdth,wght.ttf
    - family: Monaspace Argon
      fonts:
        - asset: assets/fonts/monaspace/MonaspaceArgon-VariableFont_slnt,wdth,wght.ttf
    - family: Monaspace Krypton
      fonts:
        - asset: assets/fonts/monaspace/MonaspaceKrypton-VariableFont_slnt,wdth,wght.ttf
    - family: Monaspace Neon
      fonts:
        - asset: assets/fonts/monaspace/MonaspaceNeon-VariableFont_slnt,wdth,wght.ttf
    - family: Monaspace Radon
      fonts:
        - asset: assets/fonts/monaspace/MonaspaceRadon-VariableFont_slnt,wdth,wght.ttf
    - family: Monaspace Xenon
      fonts:
        - asset: assets/fonts/monaspace/MonaspaceXenon-VariableFont_slnt,wdth,wght.ttf
    - family: Roboto Flex
      fonts:
        - asset: assets/fonts/robotoflex/RobotoFlex-VariableFont_GRAD,XOPQ,XTRA,YOPQ,YTAS,YTDE,YTFI,YTLC,YTUC,opsz,slnt,wdth,wght.ttf
